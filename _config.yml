title: Lexicon voor Onderzoek
description: Een lexicon voor onderzoek
theme: slate
markdown: kramdown

# Zorgt dat GitHub Pages ook .md-bestanden buiten de root (zoals termen/*.md
# en archetypes/*.md) meebouwt
include:
  - archetypes
  - termen

# Zorgt dat elke pagina op de site automatisch onze layout krijgt (met
# header, wikilink-omzetting en het metadata-kader), ook als een los
# bestand zelf geen "layout:" in de front matter heeft staan. Geldt voor
# alle mappen (termen/, archetypes/, en eventuele toekomstige mappen) zonder
# dat je deze regel per map hoeft uit te breiden.
defaults:
  - scope:
      path: ""
    values:
      layout: page

# Leidt page.title automatisch af uit de eerste kop (# Term) in elk
# bestand, zodat je geen aparte "title:" in de front matter hoeft bij te
# houden. Dit is een door GitHub Pages ondersteunde standaardplugin.
plugins:
  - jekyll-titles-from-headings
titles_from_headings:
  enabled: true
  strip_title: false

# Zonder deze regel zet het thema automatisch ALLE pagina's (dus alle 60+
# termen) als aparte knoppen in de header-navigatie. Dit beperkt de header
# tot Home en Graph; de volledige lijst met termen staat al netjes op de
# homepage.
header_pages:
  - index.md
  - graph.md

# Obsidian-bestanden die geen echte lexicon-term zijn (bijv. dataview-query's)
# horen niet als pagina gepubliceerd te worden. Voeg hier gerust meer
# bestandsnamen aan toe als je die tegenkomt.
exclude:
  - termen/allterms.md
